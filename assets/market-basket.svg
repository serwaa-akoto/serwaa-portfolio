<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Market Basket grocery list interface</title>
  <desc id="description">A grocery list with shopping items, prices and a progress indicator.</desc>
  <rect width="800" height="600" fill="#e8eef2"/>
  <rect x="90" y="52" width="620" height="496" rx="18" fill="#fff"/>
  <rect x="90" y="52" width="620" height="78" rx="18" fill="#103b57"/>
  <path d="M90 112h620v18H90z" fill="#103b57"/>
  <circle cx="131" cy="91" r="18" fill="#e53935"/>
  <path d="M119 89h24l-3 12h-18zm5-7 5-8m9 8-5-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="164" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Market Basket</text>
  <text x="164" y="109" fill="#dce8ef" font-family="Arial, sans-serif" font-size="13">YOUR SHOPPING LIST</text>
  <text x="133" y="176" fill="#103b57" font-family="Arial, sans-serif" font-size="23" font-weight="700">Saturday market</text>
  <text x="133" y="201" fill="#667582" font-family="Arial, sans-serif" font-size="14">4 items left to pick up</text>
  <rect x="133" y="220" width="534" height="6" rx="3" fill="#e3e9ed"/>
  <rect x="133" y="220" width="214" height="6" rx="3" fill="#e53935"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#263746">
    <rect x="133" y="250" width="534" height="55" rx="8" fill="#f4f6f8"/>
    <circle cx="160" cy="277" r="10" fill="#257747"/>
    <path d="m155 277 4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="184" y="283" fill="#8a969f" text-decoration="line-through">Ripe plantain</text>
    <text x="628" y="283" text-anchor="end" fill="#667582">₦1,200</text>
    <rect x="133" y="316" width="534" height="55" rx="8" fill="#fff"/>
    <circle cx="160" cy="343" r="10" fill="#fff" stroke="#9aa8b1" stroke-width="2"/>
    <text x="184" y="349">Fresh tomatoes</text>
    <text x="628" y="349" text-anchor="end" fill="#667582">₦900</text>
    <rect x="133" y="382" width="534" height="55" rx="8" fill="#fff"/>
    <circle cx="160" cy="409" r="10" fill="#fff" stroke="#9aa8b1" stroke-width="2"/>
    <text x="184" y="415">Rice</text>
    <text x="628" y="415" text-anchor="end" fill="#667582">₦3,500</text>
    <rect x="133" y="448" width="534" height="55" rx="8" fill="#fff"/>
    <circle cx="160" cy="475" r="10" fill="#fff" stroke="#9aa8b1" stroke-width="2"/>
    <text x="184" y="481">Groundnut oil</text>
    <text x="628" y="481" text-anchor="end" fill="#667582">₦2,100</text>
  </g>
  <circle cx="645" cy="505" r="26" fill="#e53935"/>
  <path d="M645 492v26m-13-13h26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
